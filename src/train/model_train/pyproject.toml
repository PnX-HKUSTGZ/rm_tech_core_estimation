[project]
name = "tech-core-model-train"
version = "0.1.0"
requires-python = "==3.12.*"
license-files = ["src/tech_core_model_train/litehrnet/vendor/LICENSE-*.txt"]
dependencies = [
    "tech-core-data-generator", "tech-core-data-enhancement", "torch==2.7.1", "torchvision==0.22.1",
    "ultralytics==8.3.228", "mmengine==0.10.7", "mmcv-lite==2.2.0", "opencv-python-headless",
    "onnx", "onnxruntime", "pyyaml",
]

[tool.uv.sources]
tech-core-data-generator = { workspace = true }
tech-core-data-enhancement = { workspace = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_core_model_train"]

[tool.ruff]
extend = "../pyproject.toml"
extend-exclude = ["src/tech_core_model_train/litehrnet/vendor"]
