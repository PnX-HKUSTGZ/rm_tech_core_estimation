[project]
name = "tech-core-data-enhancement"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["numpy", "opencv-python", "pyyaml", "tech-core-data-generator"]

[tool.uv.sources]
tech-core-data-generator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_core_data_enhancement"]
